# .github/workflows/agent-eval.yml
#
# Runs the agent eval pipeline (prep -> version -> regression) in CI.
# Fits a GitOps flow like this:
#   - Runs on every PR: version eval + regression eval gate the merge.
#   - Runs on every merge to main / tag: version eval scorecard is committed
#     back into the repo (e.g. eval/results/<version>.json) so history of
#     every version's scorecard lives in git, not in some external dashboard.
#   - The "baseline" scorecard for regression comparison is just whatever's
#     on main at eval/results/baseline.json - update it deliberately when
#     you accept a new baseline (e.g. via a separate promote job).

name: Agent Eval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "agent-v*"

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff against baseline file on main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Resolve agent version
        id: version
        run: |
          # Use tag if this is a tagged release, else short SHA for PR/commit runs
          if [[ "${GITHUB_REF}" == refs/tags/agent-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/agent-v}"
          else
            VERSION="sha-${GITHUB_SHA::8}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ---- Stage 1: Prep eval ----
      - name: Prep eval
        run: python prep_eval.py --dataset eval/data/test_cases.jsonl

      # ---- Stage 2: Version eval ----
      - name: Version eval
        run: |
          python version_eval.py \
            --agent-version "${{ steps.version.outputs.version }}" \
            --dataset eval/data/test_cases.jsonl \
            --out eval/results/${{ steps.version.outputs.version }}.json \
            --min-pass-rate 0.90

      - name: Upload version eval scorecard (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ steps.version.outputs.version }}
          path: eval/results/${{ steps.version.outputs.version }}.json

      # ---- Stage 3: Regression eval (compares against baseline on main) ----
      - name: Regression eval
        run: |
          python regression_eval.py \
            --baseline eval/results/baseline.json \
            --candidate eval/results/${{ steps.version.outputs.version }}.json \
            --max-pass-rate-drop 0.02

      # ---- GitOps step: commit the new scorecard back to the repo ----
      # Only do this on main/tags, not on every PR run, to keep history clean.
      - name: Commit scorecard to repo
        if: github.event_name == 'push'
        run: |
          git config user.name "eval-bot"
          git config user.email "eval-bot@users.noreply.github.com"
          git add eval/results/${{ steps.version.outputs.version }}.json
          git commit -m "eval: add scorecard for agent-v${{ steps.version.outputs.version }}" || echo "nothing to commit"
          git push
